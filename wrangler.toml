# Cloudflare deployment: this folder is served as static assets by a Worker with no code of its own.
#   Deploy: npx wrangler deploy        (run from this folder; wrangler is logged in to the Cloudflare account)
# The custom domains below are created by the deploy: DNS records and certificates are issued automatically.
# www to apex (Redirect Rule), Always Use HTTPS and DNS are managed through the scoped API token in .cloudflare-dns-token.
name = "aiskillszone"
main = "src/worker.js"
compatibility_date = "2026-06-01"
account_id = "b144a2930ea1f8b5aa135342d9103711"   # the AI Skills Zone account (chan.ad.ai.creator), not the Charme one

routes = [
  { pattern = "aiskillszone.com", custom_domain = true },
  { pattern = "www.aiskillszone.com", custom_domain = true },
]

[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"

# Daily keep-alive for the Supabase project (see src/worker.js). 03:17 UTC = 08:47 IST.
[triggers]
crons = ["17 3 * * *"]

# Public values only: the publishable key is the same one the pages use in the browser.
[vars]
SUPABASE_URL = "https://cxiezjegnnbkghbevqra.supabase.co"
SUPABASE_PUBLISHABLE_KEY = "sb_publishable_6owpYUznjQkw2VH3kvNKVA_Ay3VNhlW"

# Cloudflare deployment: this folder is served as static assets by a Worker with no code of its own.
#   Deploy: npx wrangler deploy        (run from this folder; wrangler is logged in to the Cloudflare account)
# The custom domains below are created by the deploy: DNS records and certificates are issued automatically.
# www to apex (Redirect Rule), Always Use HTTPS and DNS are managed through the scoped API token in .cloudflare-dns-token.
name = "aiskillszone"
main = "src/worker.js"
compatibility_date = "2026-06-01"
account_id = "b144a2930ea1f8b5aa135342d9103711"   # the AI Skills Zone account (chan.ad.ai.creator), not the Charme one

routes = [
  { pattern = "aiskillszone.com", custom_domain = true },
  { pattern = "www.aiskillszone.com", custom_domain = true },
]

[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
# Browser navigations to paths that are not files would otherwise get the 404 page without the Worker
# ever running; the course area must always reach the gate in src/worker.js.
run_worker_first = ["/learn/*"]

# Private course files, served only to buyers by src/worker.js. Filled by platform/publish_course.py in the course repo.
[[kv_namespaces]]
binding = "COURSE_FILES"
id = "0c0351a5d9ba46708b38761115840c74"

# Daily keep-alive for the Supabase project (see src/worker.js). 03:17 UTC = 08:47 IST.
[triggers]
crons = ["17 3 * * *"]

# Public values only: the publishable key is the same one the pages use in the browser.
[vars]
SUPABASE_URL = "https://cxiezjegnnbkghbevqra.supabase.co"
SUPABASE_PUBLISHABLE_KEY = "sb_publishable_6owpYUznjQkw2VH3kvNKVA_Ay3VNhlW"

# ---------------------------------------------------------------- dev site: dev.aiskillszone.com
#   Deploy: npx wrangler deploy --env dev
# Same files and code as the live site, a separate Worker, a separate Supabase project and a separate course
# store, behind a password (Worker secret DEV_PASSWORD; the value is in .dev-site-password, never committed).
# The Worker rewrites the live Supabase address and key in every page to the dev ones, so the HTML stays shared.
[env.dev]
name = "aiskillszone-dev"
routes = [ { pattern = "dev.aiskillszone.com", custom_domain = true } ]

[env.dev.assets]
directory = "."
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
run_worker_first = true          # every request passes the password check and the address rewrite

[[env.dev.kv_namespaces]]
binding = "COURSE_FILES"
id = "8a8170685ee44485bb4351deae976625"

[env.dev.triggers]
crons = ["23 3 * * *"]           # keeps the dev Supabase project awake too

[env.dev.vars]
SITE_ENV = "dev"
SUPABASE_URL = "https://ofuydnjqsltvlalgvnod.supabase.co"
SUPABASE_PUBLISHABLE_KEY = "sb_publishable_kDS_Snvm8YPq63lkXpOk1w_4Dt_M01P"
LIVE_SUPABASE_URL = "https://cxiezjegnnbkghbevqra.supabase.co"
LIVE_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_6owpYUznjQkw2VH3kvNKVA_Ay3VNhlW"

